card_feed:
  default: true
  description:
    en: "Render the topic list as Instagram-style post cards."
    zh_CN: "将话题列表渲染为 Instagram 风格的帖子卡片。"

show_like_count:
  default: true
  description:
    en: "Show a like (heart) button with its count on each feed card."
    zh_CN: "在每张信息流卡片上显示点赞（红心）按钮及其数量。"

rounded_avatars:
  default: true
  description:
    en: "Display avatars as circles, with a brand story-ring on the topic author."
    zh_CN: "头像显示为圆形，并在话题作者头像上加品牌故事环。"

brand_gradient_logo:
  default: true
  description:
    en: "Use the Instagram brand gradient on the site title / logo text."
    zh_CN: "站点标题/Logo 文字使用 Instagram 品牌渐变色。"

brand_gradient_buttons:
  default: false
  description:
    en: "Use the brand gradient on primary buttons (off = classic Instagram blue)."
    zh_CN: "主要按钮使用品牌渐变（关闭 = 经典 Instagram 蓝）。"

mobile_bottom_nav:
  default: true
  description:
    en: "Show an Instagram-style bottom navigation bar on mobile."
    zh_CN: "移动端显示 Instagram 风格的底部导航栏。"

accent_color:
  type: string
  default: "#0095f6"
  description:
    en: "Accent / link color (Instagram blue by default)."
    zh_CN: "强调色/链接色（默认 Instagram 蓝）。"

instagram_desktop_shell:
  default: true
  description:
    en: "Desktop: turn the left sidebar into an Instagram-style nav rail with a brand wordmark."
    zh_CN: "桌面端：把左侧边栏变成 Instagram 风格的导航竖栏，顶部带品牌字标。"

instagram_stories:
  default: true
  description:
    en: "Show an Instagram-style stories tray (built from categories) at the top of the feed."
    zh_CN: "在信息流顶部显示 Instagram 风格的 Stories 横条（由分类生成）。"

instagram_clean_feed:
  default: true
  description:
    en: "Desktop: hide the welcome banner, search box and filter/sort tabs so the feed shows only stories and posts (search/create move to the rail)."
    zh_CN: "桌面端：隐藏欢迎横幅、搜索框和筛选/排序标签，让信息流只剩 Stories 和帖子（搜索/创建移到左栏）。"

instagram_hide_header:
  default: true
  description:
    en: "Desktop: hide the top Discourse header for a pure Instagram layout (the user/avatar menu floats top-right; hamburger, logo, search and language are hidden)."
    zh_CN: "桌面端：隐藏顶部 Discourse 头部，做纯 Instagram 布局（用户/头像菜单浮在右上角；汉堡、Logo、搜索、语言切换隐藏）。"

instagram_right_sidebar:
  default: true
  description:
    en: "Desktop (>=1264px): show an Instagram-style right column with the current user, suggested users and footer links."
    zh_CN: "桌面端（≥1264px）：显示 Instagram 风格的右侧栏（当前用户、推荐用户、页脚链接）。"

instagram_messages_dock:
  default: true
  description:
    en: "Desktop: show Instagram's floating Messages dock (bottom right), listing your Discourse personal messages."
    zh_CN: "桌面端：右下角显示 Instagram 风格的「消息」浮窗，列出你的 Discourse 私信。"

instagram_suggested_category:
  type: integer
  default: 0
  min: 0
  description:
    en: "ID of the category whose subcategories (studios) fill \"Suggested for you\" in the right column (the number at the end of the category URL, e.g. /c/keyboards/10). 0: use the top-level category named 键盘; if none, show active users."
    zh_CN: "右栏「为你推荐」使用该类别下的二级类别（工作室），填类别 ID（类别网址最后的数字，如 /c/keyboards/10 填 10）。填 0 则使用名为「键盘」的一级类别；都没有时显示活跃用户。"

card_feed:
  default: true
  description:
    en: "Render the topic list as Instagram-style post cards."
    zh_CN: "将话题列表渲染为 Instagram 风格的帖子卡片。"

show_like_count:
  default: true
  description:
    en: "Show a like (heart) button with its count on each feed card."
    zh_CN: "在每张信息流卡片上显示点赞（红心）按钮及其数量。"

rounded_avatars:
  default: true
  description:
    en: "Display avatars as circles, with a brand story-ring on the topic author."
    zh_CN: "头像显示为圆形，并在话题作者头像上加品牌故事环。"

brand_gradient_logo:
  default: true
  description:
    en: "Use the Instagram brand gradient on the site title / logo text."
    zh_CN: "站点标题/Logo 文字使用 Instagram 品牌渐变色。"

brand_gradient_buttons:
  default: false
  description:
    en: "Use the brand gradient on primary buttons (off = classic Instagram blue)."
    zh_CN: "主要按钮使用品牌渐变（关闭 = 经典 Instagram 蓝）。"

mobile_bottom_nav:
  default: true
  description:
    en: "Show an Instagram-style bottom navigation bar on mobile."
    zh_CN: "移动端显示 Instagram 风格的底部导航栏。"

accent_color:
  type: string
  default: "#0095f6"
  description:
    en: "Accent / link color (Instagram blue by default)."
    zh_CN: "强调色/链接色（默认 Instagram 蓝）。"

instagram_desktop_shell:
  default: true
  description:
    en: "Desktop: turn the left sidebar into an Instagram-style nav rail with a brand wordmark."
    zh_CN: "桌面端：把左侧边栏变成 Instagram 风格的导航竖栏，顶部带品牌字标。"

instagram_stories:
  default: true
  description:
    en: "Home page only: an Instagram-style stories tray of the most recently active people (latest posts and topics, topped up from the user directory, up to 20)."
    zh_CN: "仅首页：顶部显示 Instagram 风格的 Stories 横条，列出最近活跃的用户（最新帖子和话题的参与者，不足时从用户目录补足，最多 20 人）。"

instagram_clean_feed:
  default: true
  description:
    en: "Desktop: hide the welcome banner, search box and filter/sort tabs so the feed shows only stories and posts (search/create move to the rail)."
    zh_CN: "桌面端：隐藏欢迎横幅、搜索框和筛选/排序标签，让信息流只剩 Stories 和帖子（搜索/创建移到左栏）。"

instagram_hide_header:
  default: true
  description:
    en: "Desktop: hide the top Discourse header entirely for a pure Instagram layout. Search, notifications, profile and posting are in the left rail; settings, activity, saved and log out under its More menu."
    zh_CN: "桌面端：完全隐藏顶部 Discourse 头部（包括右上角头像），做纯 Instagram 布局。搜索、通知、主页、发帖在左栏，设置、你的动态、收藏、退出在左栏「更多」里。"

instagram_right_sidebar:
  default: true
  description:
    en: "Desktop (>=1264px): show an Instagram-style right column with the current user, suggested users and footer links."
    zh_CN: "桌面端（≥1264px）：显示 Instagram 风格的右侧栏（当前用户、推荐用户、页脚链接）。"

instagram_messages_dock:
  default: true
  description:
    en: "Desktop: show Instagram's floating Messages dock (bottom right), listing your Discourse personal messages."
    zh_CN: "桌面端：右下角显示 Instagram 风格的「消息」浮窗，列出你的 Discourse 私信。"

instagram_suggested_categories:
  type: list
  default: "13"
  description:
    en: "IDs of the categories whose subcategories (studios) fill \"Suggested for you\" — the number at the end of a category URL (/c/keyboards/13 → 13). Add more IDs (e.g. the keycap category) to mix their studios in. Empty: top-level categories with the slug keyboards / keycaps or the name 键盘 / 键帽库; with none, active users are shown."
    zh_CN: "右栏「为你推荐」列出这些类别下的二级类别（工作室），填类别 ID，即类别网址最后的数字（/c/keyboards/13 填 13）。可再加键帽类别等的 ID 一起列出。留空时按别名 keyboards / keycaps 或名称「键盘」「键帽库」查找一级类别；都没有则显示活跃用户。"

instagram_tools_section:
  type: string
  default: "服务"
  description:
    en: "Title of the sidebar section whose links (Typing, drawings, group buys …) appear as a module in the right column. Empty hides the module."
    zh_CN: "右栏「服务」模块读取的侧边栏分区标题（如 Typing、图纸、团购所在的分区）。留空则不显示该模块。"

instagram_topic_style:
  default: true
  description:
    en: "Topic pages keep Discourse's own layout and behaviour but use the theme's look: Instagram icons in the post menu (red heart), hashtag tags, flat quotes / topic map / timeline, and suggested topics as a 3-column grid."
    zh_CN: "帖子详情页保留 Discourse 原生布局与逻辑，样式统一到主题：帖子菜单换成 Instagram 图标（红心）、标签显示为 #话题、引用/统计/时间轴扁平化、推荐话题为三列网格。"

instagram_auth_modal:
  default: true
  description:
    en: "Log-in and sign-up pages look like an Instagram pop-up: a centred card on a dimmed backdrop with the site logo and a close button. Discourse's own form, validation and log-in methods are unchanged."
    zh_CN: "登录和注册页显示为 Instagram 弹窗样式：变暗背景上的居中卡片，带站点 Logo 和关闭按钮。表单、校验和各种登录方式仍是 Discourse 原生的。"

instagram_explore_category:
  type: integer
  default: 13
  description:
    en: "ID of the category the rail's Explore opens (the number at the end of its URL, /c/keyboards/13 → 13). That category and its subcategories list topics as an Instagram Explore grid (3 columns, a tall tile every five, title and counts on hover), without stories or the right column. 0: Explore opens /categories and lists stay the normal feed."
    zh_CN: "左栏「探索」打开的类别 ID（类别网址最后的数字，/c/keyboards/13 填 13）。该类别及其二级类别的话题列表显示为 Instagram 探索网格（三列、每五个一个竖长格、鼠标移上显示标题和点赞/回复数），不显示 Stories 和右栏。填 0 则「探索」打开 /categories，列表保持信息流。"

instagram_post_gallery:
  default: true
  description:
    en: "Feed cards show every image of the topic's first post as an Instagram carousel (arrows, swipe, dots under the image; a stack icon on grid tiles). The post is loaded once a card is near the screen and the next image is preloaded. Off: only the first image."
    zh_CN: "信息流卡片把话题首帖里的所有图片做成 Instagram 多图轮播（左右箭头、可滑动、图下圆点；网格中显示多图图标）。卡片接近屏幕时才加载首帖，并预加载下一张。关闭则只显示第一张图。"

instagram_qa_category:
  type: integer
  default: 4
  description:
    en: "ID of the Q&A category linked in the right column's footer (the number at the end of its URL, /c/faq/4 → 4). 0 hides the link."
    zh_CN: "右栏页脚「问答与求助」链接的类别 ID（类别网址最后的数字，/c/faq/4 填 4）。填 0 不显示。"

instagram_studio_profile:
  default: true
  description:
    en: "Studio pages (subcategories of the categories in instagram_suggested_categories and instagram_explore_category) open with an Instagram profile header: logo in a story ring, name, topic / reply / active-member counts, description, about link, recent members, Follow (category notifications), New post (composer in the studio), Share, and Posts / Top tabs."
    zh_CN: "工作室页面（instagram_suggested_categories 和 instagram_explore_category 中类别下的二级类别）顶部显示 Instagram 主页样式：带彩环的 Logo、名称、帖子 / 回复 / 活跃成员数、简介、关于链接、近期成员，以及「关注」（类别通知）、「发帖」（在该工作室发帖）、分享按钮和「帖子 / 热门」标签页。"

instagram_admin_style:
  default: true
  description:
    en: "Admin pages take the theme's colours and shapes (white sidebar, round filter, grey headings, rounded rows and cards, black switches, blue / grey buttons). Discourse's own admin layout, header, sidebar and controls are unchanged; the left rail is not shown in admin."
    zh_CN: "管理后台使用主题的配色与形状（白色侧边栏、圆形搜索框、灰色分组标题、圆角行与卡片、黑色开关、蓝 / 灰按钮）。后台的布局、顶栏、侧边栏和各项操作仍是 Discourse 原生的；后台不显示左栏导航。"

instagram_explore_search:
  default: true
  description:
    en: "On the Explore category's page (instagram_explore_category) the category heading and list controls give way to Instagram's search: a round field showing your recent searches when focused and live results while typing (studios, people, tags, posts — Discourse's quick search); Enter opens Discourse's full search."
    zh_CN: "在探索类别页（instagram_explore_category）隐藏类别信息和列表控件，改为 Instagram 搜索：圆形搜索框，聚焦时显示最近搜索，输入时实时显示结果（工作室、用户、标签、帖子，使用 Discourse 快速搜索）；回车打开 Discourse 完整搜索页。"

en:
  theme_metadata:
    description: "A clean black & white Instagram-style theme for Moaclab (Discourse)."
    settings:
      card_feed: "Render the topic list as Instagram-style post cards."
      show_like_count: "Show a like button with its count on each feed card."
      rounded_avatars: "Circular avatars with a brand story-ring on the author."

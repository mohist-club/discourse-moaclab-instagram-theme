en:
  theme_metadata:
    description: "A clean black & white Instagram-style theme for Moaclab (Discourse)."
    settings:
      card_feed: "Render the topic list as Instagram-style post cards."
      show_like_count: "Show a like button with its count on each feed card."
      rounded_avatars: "Circular avatars with a brand story-ring on the author."
      brand_gradient_logo: "Use the brand gradient on the site title / logo."
      brand_gradient_buttons: "Use the brand gradient on primary buttons."
      mobile_bottom_nav: "Below 768px: Instagram bottom tab bar."
      accent_color: "Accent / link color."
      instagram_desktop_shell: "Turn the left sidebar into an Instagram nav rail (desktop)."
      instagram_stories: "Home page only: a stories tray of the most recently updated studios (7 to 10), each opening its studio page."
      instagram_clean_feed: "Hide welcome banner, search and filter tabs on the feed (desktop)."
      instagram_hide_header: "Hide the top Discourse header on desktop (avatar menu floats top-right)."
      instagram_right_sidebar: "Show the Instagram-style right column on wide desktop (you, suggested people, tools, footer)."
      instagram_messages_dock: "Show the floating Messages dock with your personal messages (desktop)."
      instagram_suggested_categories: "Parent category IDs of the studios (home stories tray, studios page, studio pages); default 13 = /c/keyboards/13."
      instagram_tools_section: "Sidebar section shown as the tools module in the right column."
      instagram_topic_style: "Topic pages keep the native layout with the theme's look."
      instagram_auth_modal: "Log-in and sign-up pages as an Instagram-style pop-up card."
      instagram_explore_category: "Explore opens this category ID, shown as an Instagram Explore grid (0: /categories)."
      instagram_post_gallery: "Feed cards show all first-post images as a carousel."
      instagram_qa_category: "Q&A category ID linked in the right column footer (default 4 = /c/faq/4)."
      instagram_studio_profile: "Studio pages open with an Instagram profile header."
      instagram_explore_search: "Instagram search on the Explore page."
      instagram_studios_page: "The rail's Search becomes 工作室, opening the studios page in Instagram's blog layout; /categories stays native."
      new_topic_composer_height: "New-topic editor height, % of the screen (0: Discourse default)."
      instagram_mobile_layout: "Below 768px: Instagram mobile top bar and edge-to-edge posts."
      instagram_custom_services: "The /custom-services page in the theme's look: Instagram profile header, tabs, a 3-column grid and post pop-ups."
      instagram_cad_viewer: "The /viewer model preview in the theme's look: canvas and settings as one card, Instagram buttons, tabs and floating toolbars."

      brand_gradient_logo: "Use the brand gradient on the site title / logo."
      brand_gradient_buttons: "Use the brand gradient on primary buttons."
      mobile_bottom_nav: "Show a bottom navigation bar on mobile."
      accent_color: "Accent / link color."
      instagram_desktop_shell: "Turn the left sidebar into an Instagram nav rail (desktop)."
      instagram_stories: "Show a stories tray built from categories at the top of the feed."
      instagram_clean_feed: "Hide welcome banner, search and filter tabs on the feed (desktop)."
      instagram_hide_header: "Hide the top Discourse header on desktop (avatar menu floats top-right)."
      instagram_right_sidebar: "Show the Instagram-style right column on wide desktop."
      instagram_messages_dock: "Show the floating Messages dock with your personal messages (desktop)."
      instagram_suggested_categories: "Right column suggestions: subcategories (studios) of these category IDs (default 13 = /c/keyboards/13)."
      instagram_tools_section: "Sidebar section shown as the tools module in the right column."
      instagram_topic_style: "Topic pages keep the native layout with the theme's look."
      instagram_auth_modal: "Log-in and sign-up pages as an Instagram-style pop-up card."

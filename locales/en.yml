      instagram_right_sidebar: "Show the Instagram-style right column on wide desktop."
      instagram_messages_dock: "Show the floating Messages dock with your personal messages (desktop)."
      instagram_suggested_categories: "Right column suggestions: subcategories (studios) of these category IDs (default 13 = /c/keyboards/13)."
      instagram_tools_section: "Sidebar section shown as the tools module in the right column."
      instagram_topic_style: "Topic pages keep the native layout with the theme's look."
      instagram_auth_modal: "Log-in and sign-up pages as an Instagram-style pop-up card."
      instagram_explore_category: "Explore opens this category ID, shown as an Instagram Explore grid (0: /categories)."
      instagram_post_gallery: "Feed cards show all first-post images as a carousel."
      instagram_qa_category: "Q&A category ID linked in the right column footer (default 4 = /c/faq/4)."
      instagram_studio_profile: "Studio pages open with an Instagram profile header."
      instagram_explore_search: "Instagram search on the Explore page."
      instagram_categories_page: "/categories as Instagram profile cards."
      new_topic_composer_height: "New-topic editor height, % of the screen (0: Discourse default)."
      instagram_mobile_layout: "Below 768px: Instagram mobile top bar and edge-to-edge posts."

# Performance, Core Web Vitals / SEO and Google Lighthouse measurements
# (spec/system/performance_spec.rb, web_vitals_seo_spec.rb,
# lighthouse_spec.rb) on Discourse's own theme workflow. Together with the
# other system tests they need more than its 10 minutes, so they run here —
# every Monday, or from the Actions tab ("Run workflow") — instead of on
# every push. Results are the IGPERF / IGVITALS / IGCRAWL / IGLH lines in
# the system tests' log.
name: Theme Measurements

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

jobs:
  # not "ci": Discourse's workflow names its concurrency group after the
  # job, and a shared group would let this run and a push's run cancel
  # each other
  measure:
    uses: discourse/.github/.github/workflows/discourse-theme.yml@v1
    with:
      skip_linting: true
